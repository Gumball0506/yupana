<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Yupana · Cambiar clave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/yupana-e1.css">
</head>
<body>
<div class="e1">
  <header class="e1-bar">
    <a class="e1-logo" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="#1a1712"></rect><circle cx="8" cy="8" r="2.2" fill="#f7f5f0"></circle><circle cx="16" cy="8" r="2.2" fill="#f7f5f0"></circle><circle cx="8" cy="16" r="2.2" fill="#f7f5f0"></circle><circle cx="16" cy="16" r="2.2" fill="#e0643a"></circle></svg>Yupana</a>
    <span class="e1-tag">Demo · datos ficticios</span>
    <span class="e1-user" id="usuario"></span>
    <a class="e1-btn quiet" id="volver" href="/panel.html">Volver</a>
  </header>
  <main class="e1-wrap">
    <form class="e1-card lg-form" id="form">
      <h1 class="e1-h1">Cambiar clave</h1>
      <p class="e1-info">Al cambiarla, se cierran tus otras sesiones abiertas. Esta sesión sigue activa.</p>
      <label class="e1-lbl" for="actual">Clave actual</label>
      <input class="e1-in" id="actual" type="password" autocomplete="current-password" required maxlength="100">
      <label class="e1-lbl" for="nueva">Clave nueva (mínimo 8 caracteres)</label>
      <input class="e1-in" id="nueva" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
      <label class="e1-lbl" for="repetir">Repite la clave nueva</label>
      <input class="e1-in" id="repetir" type="password" autocomplete="new-password" required minlength="8" maxlength="100">
      <div id="msg" aria-live="polite"></div>
      <button class="e1-btn t" type="submit">Cambiar clave</button>
      <p class="e1-info">Esta clave es solo de Yupana. Nunca escribas aquí tu clave SOL.</p>
    </form>
  </main>
</div>
<script src="/js/clave.js"></script>
</body>
</html>
