# Perfil «produccion»: endurecido. El arranque falla si falta YUPANA_SEED_CLAVE (ver ExigenciasDeProduccion).
yupana.reinicio-habilitado=false
yupana.semilla-datos=false
yupana.periodo-obligatorio=true
# Sin clave por defecto: debe venir del entorno
yupana.semilla-clave=${YUPANA_SEED_CLAVE:}
spring.h2.console.enabled=false

# Dentro del contenedor se escucha en todas las interfaces; el HTTPS lo pone el proxy (Caddy)
server.address=${YUPANA_SERVER_ADDRESS:0.0.0.0}
# Cookie Secure (solo viaja por HTTPS). Solo se desactiva para probar sin dominio: YUPANA_COOKIE_SECURE=false
server.servlet.session.cookie.secure=${YUPANA_COOKIE_SECURE:true}
# HSTS cuando se sirve por HTTPS
yupana.hsts=${YUPANA_HSTS:true}

# Detrás de Caddy, la IP real del cliente viene en X-Forwarded-For (solo se confía en proxies de red privada).
# Sin esto todos los clientes compartirían la IP del proxy y el bloqueo por IP afectaría a todos.
server.forward-headers-strategy=native

# Base de datos de producción: PostgreSQL. Todo viene del entorno (ISO 27001 A.8.9).
# O la URL completa (YUPANA_DB_URL), o sus partes (host, puerto y nombre; así las entregan Render y otros servicios)
spring.datasource.url=${YUPANA_DB_URL:jdbc:postgresql://${YUPANA_DB_HOST:localhost}:${YUPANA_DB_PORT:5432}/${YUPANA_DB_NAME:yupana}}
spring.datasource.username=${YUPANA_DB_USUARIO:yupana}
spring.datasource.password=${YUPANA_DB_CLAVE:}
