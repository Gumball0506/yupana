spring.application.name=yupana-h6
# Render y otros servicios indican el puerto con la variable PORT; en local es 8770
server.port=${PORT:8770}

# --- Red (ISO 27001 A.8.20): por defecto solo responde en este equipo. En un servidor, ponerlo detrás de HTTPS ---
server.address=${YUPANA_SERVER_ADDRESS:127.0.0.1}

# --- Errores (A.8.12): nunca se devuelve mensaje interno ni traza al cliente ---
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Datos (A.8.9): H2 en archivo para la demo; las credenciales vienen del entorno, no del código ---
# Borrar ./data para reiniciar la demo. En producción: PostgreSQL con usuario propio y clave en YUPANA_DB_CLAVE.
spring.datasource.url=jdbc:h2:file:./data/yupana;DATABASE_TO_LOWER=TRUE
spring.datasource.username=${YUPANA_DB_USUARIO:sa}
spring.datasource.password=${YUPANA_DB_CLAVE:}
spring.sql.init.mode=always

# La consola de la base queda APAGADA; para mostrarla al docente: --spring.profiles.active=docente
spring.h2.console.enabled=false

# --- Entrada (A.8.26): tamaño máximo de archivo ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# --- Negocio y seguridad de Yupana ---
yupana.tolerancia=0.01
yupana.max-filas=5000
yupana.reinicio-habilitado=true

# --- Sesión (A.5.15 / A.8.5): cookie HttpOnly (por defecto) y SameSite=Strict; 30 min sin uso = salir ---
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m

# --- Siembra: base vacía → 3 empresas ficticias, usuario del estudio y de la MYPE A. La clave viene del entorno ---
yupana.semilla-clave=${YUPANA_SEED_CLAVE:Yupana2026*}
yupana.semilla-datos=true

# --- Bloqueo de ingreso (ISO 27001 A.8.5): 5 fallos seguidos bloquean al usuario tecleado y a la IP durante 15 minutos ---
yupana.login.max-intentos=5
yupana.login.bloqueo-minutos=15

# --- Salud (Docker/Caddy): solo /actuator/health y sin detalles; ningún otro endpoint de actuator queda expuesto ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.info.env.enabled=false

# --- Límites (ISO 27001 A.8.6): peticiones por minuto y por IP en ingreso y carga ---
yupana.limite.login-por-minuto=20
yupana.limite.carga-por-minuto=30

# --- Robustez de la base: no esperar eternamente. Si pasa, la API responde 503 con un mensaje claro ---
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.jdbc.template.query-timeout=15s
