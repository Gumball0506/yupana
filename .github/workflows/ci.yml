name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Compilar y probar (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas (H2)
        run: ./mvnw -B test
      - name: Pruebas contra PostgreSQL real
        run: ./mvnw -B test -Ppostgres
      - name: Rotación de respaldos (lógica del script)
        run: sh scripts/probar_rotacion.sh
      - name: Informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-surefire
          path: target/surefire-reports/

  dependencias:
    name: Escaneo de dependencias
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Dependencias de ejecución
        run: ./mvnw -B -q dependency:list -DincludeScope=runtime -DoutputFile=target/dependencias.txt
      - name: OSV (sin clave; falla con severidad alta o crítica)
        run: python3 scripts/escaneo_osv.py target/dependencias.txt --fallar-en HIGH
      - name: OWASP Dependency-Check (solo si existe el secreto NVD_API_KEY)
        if: ${{ env.NVD_API_KEY != '' }}
        run: ./mvnw -B -Pseguridad -DskipTests verify
      - name: Informe OWASP
        if: ${{ always() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: informe-dependency-check
          path: target/dependency-check-report.*

  docker:
    name: Imagen Docker y prueba de humo
    runs-on: ubuntu-latest
    needs: pruebas
    env:
      CLAVE_CI: ci-clave-solo-para-pruebas-1
    steps:
      - uses: actions/checkout@v4
      - name: Variables de entorno de la prueba (valores solo para CI, no son secretos)
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-postgres-solo-para-pruebas|" .env
          sed -i "s|^YUPANA_SEED_CLAVE=.*|YUPANA_SEED_CLAVE=${CLAVE_CI}|" .env
      - name: Construir la imagen y levantar db + app + respaldo
        run: docker compose up --build -d db app respaldo
      - name: Prueba de humo (ingreso, carga, conciliación, casos, reinicio y persistencia)
        run: CLAVE="${CLAVE_CI}" REINICIAR="docker compose restart app" sh scripts/humo.sh
      - name: Respaldo y restauración reales (pg_dump / pg_restore)
        run: docker compose exec -T respaldo sh /scripts/probar_restauracion.sh
      - name: Registros si algo falló
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Bajar todo
        if: always()
        run: docker compose down -v
